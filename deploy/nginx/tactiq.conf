# Nginx reverse proxy — Бид туслая dashboard
#
# Байрлуулах:
#   sudo cp deploy/nginx/tactiq.conf /etc/nginx/sites-available/tactiq
#   sudo ln -sf /etc/nginx/sites-available/tactiq /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Домэйн: daamal.org (www нь apex руу 301-ээр шилжинэ — доорх блокыг үзнэ үү).
# SSL блокыг certbot автоматаар нэмнэ (setup-server.sh-г үзнэ үү) —
# тиймээс эхлээд зөвхөн 80 портын блоктойгоор ачаална.

# Node рүү хүсэлт БҮРД шинэ TCP холболт нээхийн оронд дахин ашиглана —
# олон зэрэг хэрэглэгчтэй үед handshake-ийн зардлыг тодорхой бууруулна.
# Тактиq ямар ч WebSocket ашигладаггүй (chess/draughts signaling нь
# Postgres polling) тул `keepalive`-ыг саадгүй асааж болно.
upstream tactiq_backend {
    server 127.0.0.1:3000;
    # Олон зэрэг хэрэглэгчтэй үед (polling нь хүсэлтийн тоог өсгөдөг) 64
    # keepalive холболт хурдан дүүрдэг — дүүрмэгц nginx хүсэлт бүрд шинэ TCP
    # handshake хийж эхэлнэ. 256 нь PM2 cluster-ийн бүх worker-т хүрэлцэнэ.
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 65s;
}

# www.daamal.org → daamal.org (301).
#
# ЯАГААД ТУСДАА БЛОК ВЭ: хоёр хаяг хоёулаа ИЖИЛ агуулга үйлчилбэл Google
# тэднийг ХОЁР өөр сайт гэж үзэж, эрэмбийг хуваана. Мөн session cookie нь
# хостоор ялгагддаг тул хэрэглэгч www дээр нэвтэрсэн бол apex дээр
# нэвтрээгүй харагдана. Нэг л каноник хаягтай байх нь хоёуланг шийднэ.
#
# ⚠ certbot-д хоёр домэйныг ЗЭРЭГ өгнө (`-d daamal.org -d www.daamal.org`) —
# эс бөгөөс www руу орсон хүн шилжихээсээ ӨМНӨ сертификатын алдаа хардаг.
server {
    listen 80;
    listen [::]:80;
    server_name www.daamal.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://daamal.org$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name daamal.org;

    # Let's Encrypt баталгаажуулалт
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://tactiq_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠ `Connection: ""` ЗААВАЛ хэрэгтэй — эс бөгөөс дээрх
        # `upstream`-ийн `keepalive` идэвхжихгүй (nginx хүсэлт бүрд
        # шинэ холболт нээсээр байна). WebSocket байхгүй тул Upgrade
        # header огт хэрэггүй.
        proxy_set_header Connection        "";

        # Дансны хуулга, зураг, видео upload — том body зөвшөөрнө.
        client_max_body_size 50M;

        # Excel export, statement боловсруулалт удаан байж болно.
        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;

        # ⚠ Урьд нь `proxy_buffering off` байсан. Тэр горимд nginx нь Node-той
        # холбогдсон холболтоо ХЭРЭГЛЭГЧ бүх байтыг татаж дуустал барьдаг —
        # өөрөөр хэлбэл 3G-тэй, гар утсаа халаасандаа хийсэн НЭГ удаан
        # хэрэглэгч Node-ийн event loop-ийн нөөцийг хэдэн секундээр атгана.
        # Хэдэн зуун ийм хэрэглэгч байхад л апп "унасан" мэт болдог.
        #
        # Buffering асаалттай үед nginx хариуг ӨӨРТӨӨ бүтнээр нь авч,
        # Node-ыг ШУУД суллаад, дараа нь удаан клиент рүү өөрөө дуслуулна.
        # Энэ бол удаан клиентээс хамгаалах гол давхарга.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        # Хариу дискэнд бичих хүртэл томрох нь ховор — 0 нь "диск бүү хэрэглэ,
        # шаардлагатай бол Node-ыг хүлээлгэ" гэсэн үг (I/O оргил үүсгэхгүй).
        proxy_max_temp_file_size 0;

        # Node дахин ачаалагдаж (pm2 reload) байх агшинд ирсэн хүсэлтийг
        # алдаа болгож хэрэглэгчид үзүүлэхийн оронд дараагийн worker руу
        # дахин оролдоно — деплойн үеийн "алдаа гарлаа" алга болно.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    # Хэш нэртэй статик файлууд — Node-оор дамжуулахгүй, шууд дискнээс.
    location /_next/static/ {
        alias /var/www/tactiq/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Апп-ын статик зураг (`public/images/`) — Node-оор ДАМЖУУЛАХГҮЙ, шууд
    # дискнээс. Урьд нь зураг бүр Node процесс руу очиж, `no-cache` толгойн
    # улмаас ачаалал бүрд дахин шалгагддаг байв (хуудас бүр хэдэн арван хүсэлт).
    #
    # ⚠ `immutable` БИШ, 7 хоног: файлын нэр хэшгүй тул солигдсон зураг долоо
    # хоногийн дотор хүрнэ. Зураг солих бол файлын НЭРИЙГ солих нь хамгийн
    # найдвартай (утсан дээрх service worker 30 хоног кэшилдэг).
    #
    # ⚠ `add_header` нь server түвшний толгойг ДАРДАГ (nginx удамшлын дүрэм)
    # тул хамгаалалтын толгойг энд давтан бичив.
    location /images/ {
        root /var/www/tactiq/public;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Service worker-ыг ХЭЗЭЭ Ч кэшлэхгүй — эс бөгөөс хэрэглэгч хуучин
    # хувилбарт гацна. next-pwa шинэчлэлтийг sw.js-ээр дамжуулж мэдэрдэг.
    location = /sw.js {
        proxy_pass http://tactiq_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /firebase-messaging-sw.js {
        proxy_pass http://tactiq_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Аюулгүй байдлын толгойнууд (HSTS-ыг certbot SSL тавьсны дараа нэмнэ)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
